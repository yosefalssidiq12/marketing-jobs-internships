name: refresh
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 2 * * *'   # daily 04:17 Africa/Cairo (02:17 UTC); off-the-hour to spread load
permissions:
  contents: write
concurrency:
  group: refresh-${{ github.repository }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run refresh (collect, classify, verify, rebuild)
        run: python3 pipeline/refresh.py --site "marketing" --repo-root .
      - name: Commit if changed
        run: |
          git config user.name "career-refresh-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # stage ONLY the intended outputs of an accepted run (never pipeline-state.json.next or collected.json)
          git add index.html "pipeline/data-release/marketing.json" pipeline/pipeline-state.json pipeline/refresh-report.json
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push; fi
      - name: Jooble Egypt internal discovery (prototype; internal store only, never published)
        if: always()
        continue-on-error: true
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python3 pipeline/jooble_collect.py --site "marketing"
      - name: Jooble promotion (bounded verified-original promotion; internal unless all gates pass)
        if: always()
        continue-on-error: true
        run: python3 pipeline/jooble_promote.py
