name: refresh
# v3 (data-branch architecture) + integrated Jooble Egypt top-N (v6 fold-in):
# - `data-publish` runs ONLY on the daily schedule and publishes ONLY the
#   verified jobs JSON + pipeline-state.json + refresh-report.json to the
#   `data` branch (three-file variant, report-persistence amendment).
#   It never commits to main and never builds the frontend.
# - Jooble Egypt runs INSIDE data-publish: collect (API, runner-local store)
#   and promote (bounded original-page verification, incl. same-day re-check
#   of every previously published Jooble card) run BEFORE refresh.py, and the
#   fold step after refresh.py appends promoted records to the payload in the
#   exact card schema, refreshes re-verified labels, and records an honest
#   jooble section in the report. Fold never touches generated_at (the
#   publish-ready marker stays authoritative) and never breaks the base
#   publication: any fold invalidity restores the pre-fold outputs and marks
#   the report jooble.status=failed.
# - `frontend-build` runs ONLY on manual workflow_dispatch and rebuilds the
#   shell on main. It never runs the collector and never touches `data`.
# - No PAT, no new secrets. Both jobs use the built-in GITHUB_TOKEN with
#   job-level `contents: write` only.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 2 * * *'   # daily 04:17 Africa/Cairo (02:17 UTC); off-the-hour to spread load

concurrency:
  group: refresh-${{ github.repository }}
  cancel-in-progress: false

env:
  # Per-repo value: bapm | ai | marketing (this file ships with marketing).
  SITE_SLUG: marketing

jobs:
  data-publish:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record HEAD (no commit to main may appear)
        run: echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify data branch exists (never create it here)
        run: |
          git ls-remote --exit-code --heads origin data \
            || { echo "::error::data branch does not exist. Create it once from a correctly configured main (see PROPOSAL.md §E) and re-run."; exit 1; }
      - name: Add data worktree
        run: git fetch --depth=1 origin data && git worktree add --detach /tmp/data-worktree "$(git rev-parse origin/data)"
      - name: Copy accepted state + previous release back (working-tree only)
        run: |
          # N-1: pipeline-state.json is the source of truth on `data`. Copy it
          # back so collect.py merge_state / refresh.py see the accepted state.
          # N-1b: same for the previous data-release JSON — refresh.py reads it
          # as `prev` (same-day carry candidates, gate ratio vs previous
          # snapshot) and jooble_promote reads it for the published-card
          # re-check. Both copies are working-tree only and are restored at
          # the end; nothing is committed to main.
          if [ -f /tmp/data-worktree/pipeline/pipeline-state.json ]; then
            cp /tmp/data-worktree/pipeline/pipeline-state.json pipeline/pipeline-state.json
          fi
          if [ -f "/tmp/data-worktree/pipeline/data-release/${SITE_SLUG}.json" ]; then
            cp "/tmp/data-worktree/pipeline/data-release/${SITE_SLUG}.json" "pipeline/data-release/${SITE_SLUG}.json"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Jooble Egypt discovery (runner-local internal store)
        id: jcollect
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          echo "JOOBLE_STATUS=skipped" >> "$GITHUB_ENV"
          EC=0
          python3 pipeline/jooble_collect.py --site "${SITE_SLUG}" || EC=$?
          if [ "$EC" -eq 0 ]; then
            echo "JOOBLE_STATUS=ok" >> "$GITHUB_ENV"
          else
            echo "JOOBLE_STATUS=failed" >> "$GITHUB_ENV"
            echo "JOOBLE_REASON=collect exit $EC" >> "$GITHUB_ENV"
          fi

      - name: Jooble promotion (bounded original verification + published-card re-check)
        id: jpromote
        run: |
          if [ "${JOOBLE_STATUS}" != "ok" ]; then
            echo "skipping promote: collect status ${JOOBLE_STATUS}"
          elif [ ! -f pipeline/jooble-candidates.json ]; then
            echo "JOOBLE_STATUS=skipped" >> "$GITHUB_ENV"
            echo "JOOBLE_REASON=no candidate store" >> "$GITHUB_ENV"
          else
            EC=0
            python3 pipeline/jooble_promote.py \
              --prev-data "pipeline/data-release/${SITE_SLUG}.json" --max-fetches 20 || EC=$?
            if [ "$EC" -ne 0 ]; then
              echo "JOOBLE_STATUS=failed" >> "$GITHUB_ENV"
              echo "JOOBLE_REASON=promote exit $EC" >> "$GITHUB_ENV"
            fi
          fi

      - name: Run refresh (collect, classify, verify — no build, no publish)
        run: python3 pipeline/refresh.py --site "${SITE_SLUG}" --repo-root .

      - name: Jooble fold (append verified Jooble cards; honest report section)
        id: jfold
        run: |
          DATA="pipeline/data-release/${SITE_SLUG}.json"
          cp "$DATA" /tmp/fold-backup-data.json
          cp pipeline/pipeline-state.json /tmp/fold-backup-state.json
          cp pipeline/refresh-report.json /tmp/fold-backup-report.json
          FOLD_EC=0
          python3 pipeline/jooble_fold.py \
            --data "$DATA" --state pipeline/pipeline-state.json \
            --report pipeline/refresh-report.json \
            --promotions pipeline/jooble-promotions.json \
            --store pipeline/jooble-candidates.json \
            --status "${JOOBLE_STATUS:-skipped}" \
            --status-reason "${JOOBLE_REASON:-}" \
            --date "$(date -u +%F)" || FOLD_EC=$?
          if [ "$FOLD_EC" -eq 0 ]; then
            python3 - "$DATA" <<'PY' || FOLD_INVALID=1
          import json, sys
          d = json.load(open(sys.argv[1]))
          r = json.load(open("pipeline/refresh-report.json"))
          json.load(open("pipeline/pipeline-state.json"))
          assert "jooble" in r, "jooble section missing from report"
          assert r["counts"]["publishable"] == len(d["jobs"]), "publishable count mismatch"
          for j in d["jobs"]:
              if j.get("source") == "Jooble":
                  assert (j.get("canonical_key") or "").startswith("jooble:"), "bad jooble canonical_key"
                  assert j.get("verified") is True, "unverified Jooble card"
                  assert (j.get("url") or "").startswith("https://"), "non-https Jooble url"
          print("fold validation OK:", r["jooble"])
          PY
          fi
          if [ "$FOLD_EC" -ne 0 ] || [ "${FOLD_INVALID:-0}" = "1" ]; then
            cp /tmp/fold-backup-data.json "$DATA"
            cp /tmp/fold-backup-state.json pipeline/pipeline-state.json
            cp /tmp/fold-backup-report.json pipeline/refresh-report.json
            REASON="fold output invalid; base publication restored"
            [ "$FOLD_EC" -ne 0 ] && REASON="fold exited $FOLD_EC; base publication restored"
            python3 - "$REASON" <<'PY'
          import json, sys
          r = json.load(open("pipeline/refresh-report.json"))
          r["jooble"] = {"status": "failed", "reason": sys.argv[1],
                         "requests": None, "unique": None, "eligible": None,
                         "promoted": 0, "folded": 0, "dropped": 0}
          json.dump(r, open("pipeline/refresh-report.json", "w"), ensure_ascii=False, indent=2)
          print("restored base outputs; report marked jooble.status=failed:", sys.argv[1])
          PY
          fi

      - name: Verify publish-ready marker + payload
        run: |
          MARKER="pipeline/.publish-ready-${SITE_SLUG}"
          DATA="pipeline/data-release/${SITE_SLUG}.json"
          test -f "$MARKER" || { echo "::error::no publish-ready marker — the gate did not pass or refresh failed"; exit 1; }
          test -f "$DATA" || { echo "::error::no data file"; exit 1; }
          GEN=$(python3 -c "import json;print(json.load(open('$DATA'))['generated_at'])")
          test "$(cat "$MARKER")" = "$GEN" || { echo "::error::marker does not match payload generated_at"; exit 1; }
          python3 - "$DATA" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          assert isinstance(p.get("generated_at"), str) and p["generated_at"], "generated_at missing"
          assert isinstance(p.get("jobs"), list), "jobs missing"
          assert p.get("release_candidate") is True, "not a release candidate"
          print("payload OK:", p["generated_at"], len(p["jobs"]), "jobs")
          PY
          rm -f "$MARKER"
      - name: Publish verified JSON + state + report to data branch
        run: |
          DATA="pipeline/data-release/${SITE_SLUG}.json"
          STATE="pipeline/pipeline-state.json"
          REPORT="pipeline/refresh-report.json"
          cp "$DATA" "/tmp/data-worktree/$DATA"
          cp "$STATE" "/tmp/data-worktree/$STATE"
          cp "$REPORT" "/tmp/data-worktree/$REPORT"
          cd /tmp/data-worktree
          git add "$DATA" "$STATE" "$REPORT"
          STAGED=$(git diff --cached --name-only | sort)
          EXPECTED=$(printf "%s\n%s\n%s" "$DATA" "$STATE" "$REPORT" | sort)
          test "$STAGED" = "$EXPECTED" || { echo "::error::staged files are not exactly the JSON + state + report:"; echo "$STAGED"; exit 1; }
          if git diff --cached --quiet; then
            echo "no changes on data branch"
          else
            git -c user.name="career-refresh-bot" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "data: ${SITE_SLUG} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:data
          fi
      - name: Restore main checkout and verify no main commit
        if: always()
        run: |
          git worktree remove --force /tmp/data-worktree || true
          git checkout -- pipeline/pipeline-state.json "pipeline/data-release/${SITE_SLUG}.json" pipeline/refresh-report.json 2>/dev/null || true
          rm -f "pipeline/.publish-ready-${SITE_SLUG}" pipeline/jooble-candidates.json pipeline/jooble-promotions.json
          test "$(git rev-parse HEAD)" = "$HEAD_BEFORE" || { echo "::error::HEAD moved on main — a main commit was created"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::tracked files modified on main checkout:"; git status --porcelain --untracked-files=no; exit 1; }

  frontend-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend shell (no jobs embedded)
        run: python3 pipeline/repro_build.py "${SITE_SLUG}" .
      - name: Verify shell has no embedded jobs
        run: |
          python3 - <<'PY'
          s = open("index.html", encoding="utf-8").read()
          assert "__DATA__" not in s, "shell still contains __DATA__"
          assert '"jobs": [' not in s, "shell embeds a jobs payload"
          print("shell OK, no embedded jobs,", len(s), "bytes")
          PY
      - name: Commit shell to main if changed
        run: |
          git config user.name "career-refresh-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no frontend changes"
          else
            git commit -m "frontend: rebuild shell $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push
          fi
